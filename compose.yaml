services:
  db:
    image: postgres:17
    container_name: error-free-text-db
    environment:
      POSTGRES_DB: error_free_text
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d error_free_text"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: error-free-text-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: error_free_text
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres-data: